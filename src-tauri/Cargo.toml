[package]
name = "notego"
version = "0.1.0"
description = "NoteGo - 本地优先的 Markdown 知识库"
authors = ["NoteGo Contributors"]
edition = "2021"
rust-version = "1.77"

# Tauri 2.x 移动端构建需要 (此项目先专注桌面端)
[lib]
name = "notego_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
notify = "6"
pulldown-cmark = "0.10"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
sha2 = "0.10"
blake3 = "1"
walkdir = "2"
hex = "0.4"
regex = "1"
serde_yaml = "0.9"

[features]
# 默认关闭自定义协议，可按需开启
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
